name: Run PIC Scraper

on:
  # Weekly recurring run, scrapes everything already saved in config.json
  schedule:
    - cron: "0 2 * * 1"   # every Monday 02:00 UTC

  # Manual run — GitHub renders these as a form when you click "Run workflow"
  workflow_dispatch:
    inputs:
      sector:
        description: "Scrape an existing sector (exact match, e.g. Environmental NGO). Leave blank if adding a new org below."
        required: false
        type: string
      org_name:
        description: "NEW org name (leave blank to just scrape the sector above)"
        required: false
        type: string
      org_sector:
        description: "Sector for the new org (e.g. Environmental NGO, Retail Corporate)"
        required: false
        type: string
      team_url:
        description: "New org's Team / About / Leadership page URL"
        required: false
        type: string
      contact_url:
        description: "New org's Contact page URL"
        required: false
        type: string
      render_js:
        description: "Is the site JS-heavy (React/Vue/Next.js)?"
        required: false
        type: boolean
        default: false
      save_to_library:
        description: "Save this new org into config.json for future runs?"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (for JS-heavy sites)
        run: playwright install --with-deps chromium

      - name: Scrape (scheduled run — full library)
        if: github.event_name == 'schedule'
        run: python scraper.py --all

      - name: Scrape (manual run — form inputs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scraper.py \
            --sector "${{ github.event.inputs.sector }}" \
            --org-name "${{ github.event.inputs.org_name }}" \
            --org-sector "${{ github.event.inputs.org_sector }}" \
            --team-url "${{ github.event.inputs.team_url }}" \
            --contact-url "${{ github.event.inputs.contact_url }}" \
            --render-js "${{ github.event.inputs.render_js }}" \
            --save-to-library "${{ github.event.inputs.save_to_library }}"

      - name: Commit results back to the repo
        run: |
          git config user.name "pic-scraper-bot"
          git config user.email "actions@github.com"
          git add data/results.csv data/last_run.txt config.json
          git commit -m "Scrape run: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push
